  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Майлего Генератор</title>
</head>
<body>

  <img id="bouncingImage" src="/assets/dvd.jpg" alt="DVD Background">

  <div class="container">
    <div class="site-logo">
      ПЕРЕМАЙЛЕГОДАЧ
    </div>

    <div class="card">
      <h2>Режим перекладу</h2>
      <div class="tabs">

          <svg class="spark-svg"><rect class="spark-path" rx="8" ry="8" x="1" y="1"></rect></svg>
        </div>
      </div>
      <textarea id="userInput" placeholder="Пиши/вставляй непотріб тут..."></textarea>
    </div>

    <div class="card">
      <h2>Результат</h2>
      <div id="output" class="output-box">
        <span class="placeholder">Тут з'явиться майлеготат.</span>
      </div>
      <div class="spark-btn-wrapper copy-btn-wrapper full-width">
        <button id="copyBtn" type="button" class="spark-btn">Скопіювати</button>
        <svg class="spark-svg"><rect class="spark-path" rx="8" ry="8" x="1" y="1"></rect></svg>
      </div>
    </div>
  </div>
